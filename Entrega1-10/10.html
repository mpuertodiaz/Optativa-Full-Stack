<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <div id="saludos"></div>

    <script>
        var entrada = prompt("introduce nombres separados por coma");

        if (entrada) {
            var lista = entrada.split(",");
            var contenedor = document.getElementById("saludos");

            for (let i in lista) {
                let nombre = lista[i].trim();
                if (nombre !== "") {
                    contenedor.innerHTML += `<p>Hola, ${nombre}</p>`;
                }
            }

            // Datos extra
            contenedor.innerHTML += `<p>Total: ${lista.length}</p>`;
            contenedor.innerHTML += `<p>Primero: ${lista[0].trim()}</p>`;
            contenedor.innerHTML += `<p>Ultimo: ${lista[lista.length - 1].trim()}</p>`;

            // Consola
            var copia = [...lista];
            console.log("Orden normal", copia.sort());
            console.log("Inverso", copia.reverse());
        }
    </script>

</body>
</html>
