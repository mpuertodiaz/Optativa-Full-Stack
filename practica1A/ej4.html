<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ejercicio</title>
</head>
<body>
<p>Ciudad: <span id="ciudad"></span></p>
<p>Gastos de envío: <span id="gastos" ></span></p>
<h1>Fecha de envío: <span id="fecha"></span></h1>

<script>
function cargarDatos() {
    var ciudad = document.getElementById("ciudad");
    var gastos = document.getElementById("gastos");
    var fecha = document.getElementById("fecha");
    var hoy = new Date();

    ciudad.innerHTML = "Sevilla";
    gastos.innerHTML = "3€";

   
    fecha.innerHTML = hoy.getDate() + "/" + (hoy.getMonth() + 1) + "/" + hoy.getFullYear();
    console.log("datos cargados");
}


window.onload = cargarDatos;
</script>
</body>
</html>
